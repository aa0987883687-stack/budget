<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>月薪分配記帳本</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&display=swap">
<style>
:root{--bg:#E6EEDC;--sf:#F6F8EF;--ink:#1E2F24;--mute:#5A6F5F;--line:#C4D3B8;--jade:#4A7C52;--coral:#B5412F;--sky:#3D6B76;--on:#F6F8EF;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="dark"]{--bg:#16241B;--sf:#1E2E24;--ink:#E7EEDD;--mute:#9DB29F;--line:#33493A;--jade:#8CC590;--coral:#E8836F;--sky:#7FB4BE;--on:#16241B;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 "Noto Serif TC","Songti TC","PMingLiU",serif}
main{max-width:680px;margin:0 auto;padding:16px 16px 72px}
h1{font-size:20px;margin:0}h2{font-size:16px;margin:0 0 10px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.mon{display:flex;align-items:center;gap:6px;font-weight:700}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--sf);border-radius:8px;padding:6px 12px}
button.p{background:var(--jade);color:var(--on);border-color:var(--jade);font-weight:500}
button.x{border:0;background:none;color:var(--coral);padding:4px 8px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--sky);outline-offset:2px}
input,select{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 10px;min-width:0;width:100%}
nav{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px}
nav button{border:0;border-bottom:3px solid transparent;border-radius:0;background:none;padding:8px 14px;color:var(--mute)}
nav button[aria-selected="true"]{color:var(--ink);border-color:var(--jade);font-weight:700}
.box{background:var(--sf);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
.alert{background:var(--sf);border:1px solid var(--coral);border-left-width:6px;border-radius:10px;padding:10px 14px;margin-bottom:12px;display:flex;gap:10px;align-items:center;justify-content:space-between}
.big{font-size:34px;font-weight:700;line-height:1.2}
.big.neg{color:var(--coral)}
.mute{color:var(--mute);font-size:14px}
.bar{display:flex;height:16px;border-radius:8px;overflow:hidden;background:var(--line);margin:10px 0 6px}
.bar i{display:block;height:100%}
.leg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:14px}
.leg b{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px}
.row{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px dashed var(--line)}
.row:last-child{border:0}
.row span:last-child{font-variant-numeric:tabular-nums;white-space:nowrap}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g3{display:grid;grid-template-columns:2fr 1fr auto;gap:8px;margin-bottom:8px;align-items:center}
.prog{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:6px}
.prog i{display:block;height:100%;background:var(--jade)}
label{display:block;font-size:14px;color:var(--mute);margin-bottom:3px}
.tx{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.tx .d{flex:1;min-width:0}.tx .d small{display:block;color:var(--mute)}
.tx .a{font-variant-numeric:tabular-nums;font-weight:500}
.acc{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-bottom:10px;align-items:center}.acc .on{grid-column:1/-1;display:flex;gap:6px;align-items:center;color:var(--ink);margin:0}.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.pie{display:flex;gap:16px;align-items:center;flex-wrap:wrap}.pie svg{width:150px;height:150px;flex:none}.pie .leg{flex:1;min-width:180px;flex-direction:column}.hide{display:none}
@media (max-width:420px){.big{font-size:28px}}
body::before,body::after{content:"";position:fixed;top:0;bottom:0;width:44px;background:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='44' height='320' viewBox='0 0 44 320'><path d='M14 0V320' stroke='%234A7C52' stroke-width='6' fill='none'/><path d='M8 60h12M8 140h12M8 220h12M8 300h12' stroke='%23355C3B' stroke-width='3' fill='none'/><path d='M20 140C32 132 40 134 44 124 38 142 30 146 20 140ZM20 220C32 212 40 214 44 204 38 222 30 226 20 220Z' fill='%234A7C52'/></svg>") repeat-y;opacity:.5;pointer-events:none}
body::before{left:-10px}body::after{right:-10px;transform:scaleX(-1)}
main{position:relative;z-index:1}
h1{letter-spacing:.08em}
.seal{display:inline-block;background:var(--coral);color:#F6F1E4;width:1.5em;height:1.5em;line-height:1.5em;text-align:center;border-radius:3px;font-size:.8em;margin-right:8px;vertical-align:middle;transform:rotate(-4deg)}
h2{border-left:4px solid var(--jade);padding-left:8px;line-height:1.3}
.box{border-radius:6px;box-shadow:inset 0 0 0 3px var(--sf),inset 0 0 0 4px var(--line)}
button,input,select{border-radius:4px}
.grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.acc{grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto}
.g3{grid-template-columns:minmax(0,2fr) minmax(0,1fr) auto}
.grid>div,.acc>*,.g3>*{min-width:0}
input[type="date"],input[type="time"],input[type="month"]{-webkit-appearance:none;appearance:none;display:block;width:100%;max-width:100%;min-width:0;min-height:42px;text-align:left}
input[type="date"]::-webkit-date-and-time-value,input[type="time"]::-webkit-date-and-time-value{text-align:left}
h2.fold{display:flex;justify-content:space-between;align-items:center;cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
h2.fold::after{content:"";flex:none;width:8px;height:8px;margin:0 4px 4px 12px;border-right:2px solid var(--mute);border-bottom:2px solid var(--mute);transform:rotate(45deg);transition:transform .2s}
.box.shut h2.fold::after{transform:rotate(-45deg);margin-bottom:0}
.box.shut>*:not(h2.fold){display:none}
.box.shut h2.fold{margin-bottom:0}
#toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:6px;font-size:15px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:50;max-width:calc(100% - 32px);text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
[data-fid]{padding-bottom:8px;border-bottom:1px dashed var(--line);margin-bottom:10px}
.pr{display:flex;flex-wrap:wrap;gap:20px 24px}.pw{flex:1 1 260px;min-width:0}.pw h3{margin:0 0 8px;font-size:15px}.pw .pie svg{width:130px;height:130px}.pw .pie .leg{min-width:140px}
.seg{display:inline-flex;margin:0 10px 8px 0}.seg button{padding:4px 12px;border-radius:0;margin-left:-1px}.seg button:first-child{border-radius:4px 0 0 4px;margin-left:0}.seg button:last-child{border-radius:0 4px 4px 0}
.lk{display:block;cursor:pointer;padding:3px 0;-webkit-tap-highlight-color:transparent}.lk:hover{text-decoration:underline}.lk.on{font-weight:700;color:var(--jade)}
.leg.col{flex-direction:column;gap:2px}
.dt{margin-top:14px;padding-top:10px;border-top:1px dashed var(--line)}
</style>
</head>
<body>
<main>
<div class="top">
  <h1><span class="seal">帳</span>月薪分配記帳本</h1>
  <div class="mon"><button id="pm" aria-label="上個月">‹</button><span id="ml"></span><button id="nm" aria-label="下個月">›</button></div>
</div>
<div id="alerts"></div>
<nav role="tablist">
  <button role="tab" data-t="home" aria-selected="true">總覽</button>
  <button role="tab" data-t="log" aria-selected="false">記帳</button>
  <button role="tab" data-t="set" aria-selected="false">設定</button>
</nav>
<section id="home"></section>
<section id="log" class="hide"></section>
<section id="set" class="hide"></section>
</main>
<script>
(function(){
var KEY="budget-planner-v1",CATS=["餐飲","交通","購物","娛樂","醫療","其他"];
var S={theme:"light",xfer:[],rates:{},accts:[],cap:0,warn:80,salary:0,payday:5,daily:true,dtime:"21:00",rate:20,fixed:[],tx:[],start:ym(new Date()),notified:"",dis:{}};
try{var raw=localStorage.getItem(KEY);if(raw){var o=JSON.parse(raw);for(var k in o)S[k]=o[k];}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function pad(n){return n<10?"0"+n:""+n}
function ymd(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function ym(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function nt(n){return "NT$ "+Math.round(n).toLocaleString("en-US")}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
var view=ym(new Date()),tab="home",editTx=null,editX=null,sel=null;
function dim(m){var p=m.split("-");return new Date(+p[0],+p[1],0).getDate()}
function fixedSum(){return S.fixed.reduce(function(a,f){return a+(+f.amt||0)/(+f.every||1)},0)}
function spent(m){return S.tx.filter(function(t){return t.date.slice(0,7)===m&&t.type!=="in"}).reduce(function(a,t){return a+t.amt},0)}
function incomeOf(m){return S.tx.filter(function(t){return t.date.slice(0,7)===m&&t.type==="in"}).reduce(function(a,t){return a+t.amt},0)}
function shift(m,n){var p=m.split("-");return ym(new Date(+p[0],+p[1]-1+n,1))}
function cumSaved(){var m=S.start,cur=ym(new Date()),tot=0,g=0;if(m>cur)m=cur;while(m<=cur&&g++<600){tot+=salaryOf(m)+incomeOf(m)-fixedSum()-spent(m);m=shift(m,1)}return tot}
function $(id){return document.getElementById(id)}
function autoCap(m){return Math.max(0,salaryOf(m||ym(new Date()))-fixedSum()-baseSalary(m||ym(new Date()))*S.rate/100)}
function cap(m){return S.cap>0?S.cap:autoCap(m)}
function monthSave(){return baseSalary(ym(new Date()))*S.rate/100}
function isDue(f,m){var e=+f.every||1;if(e<2)return true;var a=(f.start||m).split("-"),b=m.split("-"),d=(+b[0]-+a[0])*12+(+b[1]-+a[1]);return ((d%e)+e)%e===0}
function evOpts(s){s=+s||1;return [[1,"每月繳"],[2,"每 2 個月繳"],[3,"每 3 個月繳"],[6,"每 6 個月繳"],[12,"每年繳"]].map(function(o){return '<option value="'+o[0]+'"'+(o[0]===s?" selected":"")+'>'+o[1]+'</option>'}).join("")}
function payFixed(f,nx){var a=acctById(f.acct),n=new Date(),mm=nx?shift(ym(n),1):ym(n),w=nx?"下個月":"這個月";S.fpaid=S.fpaid||{};S.fpaid[mm]=S.fpaid[mm]||{};var ta=acctById(f.to);if(!a&&!ta)return "請先選擇扣款帳戶或轉入帳戶";if(!(+f.amt>0))return "金額要大於 0";if(!isDue(f,mm))return w+"不是這筆的繳費月份";if(S.fpaid[mm][f.id]){var has=S.xfer.some(function(x){return x.fid===f.id&&x.fm===mm});if(has)return w+"已經扣過了";var key=f.id+mm;if(rePay!==key){rePay=key;return "系統記得"+w+"已處理，但找不到對應的轉帳紀錄（可能已刪除）。再按一次就會重新記錄"}}rePay=null;fxfer(f,a,ta,ymd(n),nx?"預付 "+(+mm.slice(5))+" 月":"提早繳",mm);S.fpaid[mm][f.id]=1;save();renderAll();return nx?"✓ 已扣款並標記下個月已付":"✓ 已扣款並標記本月已付"}
function fillEdit(){var t=editTx?S.tx.filter(function(x){return x.id===editTx})[0]:null;if(editTx&&!t)editTx=null;
  if(t&&$("ladd")){var v=(t.type==="in"?"i:":"o:")+t.cat,s=$("lc");if(!Array.prototype.some.call(s.options,function(o){return o.value===v}))s.add(new Option(t.cat,v));$("ld").value=t.date;$("la").value=t.oa!=null?t.oa:t.amt;s.value=v;$("lk").value=t.acct||"";$("ln").value=t.note||"";var a=acctById(t.acct);$("lal").textContent="金額（"+(a?(a.cur||"TWD"):"TWD")+"）";$("ladd").textContent="儲存修改";if(!$("lcan")){var b=document.createElement("button");b.id="lcan";b.textContent="取消修改";b.style.marginLeft="8px";b.onclick=function(){editTx=null;renderAll()};$("ladd").parentNode.appendChild(b)}$("ladd").scrollIntoView({block:"center"})}
  var x=editX?S.xfer.filter(function(y){return y.id===editX})[0]:null;if(editX&&!x)editX=null;
  if(x&&$("xadd")){$("xf").value=x.from||"";$("xt").value=x.to||"";$("xa").value=x.amt;$("xg").value=x.got;$("xd").value=x.date;$("xn").value=x.note||"";$("xadd").textContent="儲存修改";if(!$("xcan")){var c=document.createElement("button");c.id="xcan";c.textContent="取消修改";c.style.marginLeft="8px";c.onclick=function(){editX=null;renderAll()};$("xadd").parentNode.appendChild(c)}$("xadd").scrollIntoView({block:"center"})}}
var rePay=null;
function fxfer(f,a,ta,date,tag,fm){var g=a?r2(f.amt/rate(a.cur)):0,h2=ta?r2(f.amt/rate(ta.cur)):0;S.xfer.push({id:uid(),date:date,from:a?a.id:"",to:ta?ta.id:"",amt:a?g:h2,got:ta?h2:0,note:"固定支出："+f.name+"（"+tag+"）",auto:1,fid:f.id,fm:fm});if(a)a.bal=r2((+a.bal||0)-g);if(ta)ta.bal=r2((+ta.bal||0)+h2)}
function otherAcct(){var O=(S.accts||[]).filter(function(a){return !a.on&&(+a.bal||0)!==0});if(!O.length)return "";var h='<div class="mute" style="margin-top:12px">不計入合計的帳戶（累計用）</div>';O.forEach(function(a){h+='<div class="row"><span>'+esc(a.name)+'</span><span>'+fmt(+a.bal||0,a.cur)+'</span></div>'});return h}
function anaMonths(){var cur=ym(new Date());if(!(S.vp&&S.vp.r==="y"))return [view];var y=view.slice(0,4),L=[];for(var i=1;i<=12;i++){var mm=y+"-"+pad(i);if(mm>=S.start&&mm<=cur)L.push(mm)}return L}
function anaData(){var L=anaMonths(),byA=!!(S.vp&&S.vp.b==="a"),items=[],T={sal:0,oth:0,fx:0,sp:0,goal:0};
  function an(id){var a=acctById(id);return a?a.name:"未指定"}
  L.forEach(function(mm){var s=salaryOf(mm);T.sal+=s;T.goal+=baseSalary(mm)*S.rate/100;
    if(s>0&&S.pieSal!==false)items.push({t:"in",g:byA?an(S.payAcct):"月薪",a:s,d:mm,n:"月薪",s:"sal"});
    S.fixed.forEach(function(f){var v=(+f.amt||0)/(+f.every||1);if(v>0){T.fx+=v;items.push({t:"out",g:byA?an(f.acct):"固定支出",a:v,d:mm,n:f.name,s:"fix"})}})});
  S.tx.forEach(function(x){if(L.indexOf(x.date.slice(0,7))<0)return;var ti=x.type==="in"?"in":"out";items.push({t:ti,g:byA?an(x.acct):x.cat,a:x.amt,d:x.date,n:x.note||x.cat,c:x.cat,s:"tx",x:x});if(ti==="in")T.oth+=x.amt;else T.sp+=x.amt});
  return {L:L,items:items,T:T}}
function agg(items,t){var by={},sum=0;items.forEach(function(i){if(i.t===t){by[i.g]=(by[i.g]||0)+i.a;sum+=i.a}});return {by:by,sum:sum,ks:Object.keys(by).sort(function(a,b){return by[b]-by[a]})}}
function colOf(t,k){var byA=S.vp&&S.vp.b==="a",L=byA?(S.accts||[]).map(function(a){return a.name}).concat(["未指定"]):(t==="in"?["月薪"].concat(INCATS):CATS.concat(["固定支出"])),i=L.indexOf(k);return PC[(i>=0?i:5)%PC.length]}
function pieX(t,D,textOnly){var A=agg(D.items,t),h='<div class="pw"><h3>'+(t==="in"?"收入":"支出")+(t==="in"?' <button data-pietog="1" style="font-size:13px;padding:2px 10px;margin-left:6px" aria-label="切換收入圖是否含月薪">'+(S.pieSal!==false?"含月薪":"不含月薪")+'</button>':'')+'</h3>';
  if(!A.ks.length)return h+'<p class="mute" style="margin:0">這段期間還沒有紀錄。</p></div>';
  var off=25,svg='<svg viewBox="0 0 42 42" role="img" aria-label="'+(t==="in"?"收入":"支出")+'圓餅圖"><circle cx="21" cy="21" r="15.9155" fill="none" stroke="var(--line)" stroke-width="8"/>',lg='<div class="leg'+(textOnly?' col':'')+'">';
  A.ks.forEach(function(k){var p=A.by[k]/A.sum*100,col=colOf(t,k);svg+='<circle cx="21" cy="21" r="15.9155" fill="none" stroke="'+col+'" stroke-width="8" stroke-dasharray="'+p+' '+(100-p)+'" stroke-dashoffset="'+off+'"/>';off-=p;lg+='<a class="lk'+(sel===t+"|"+k?' on':'')+'" role="button" tabindex="0" data-g="'+esc(t+"|"+k)+'"><b style="background:'+col+'"></b>'+esc(k)+' '+nt(A.by[k])+'（'+Math.round(p)+'%）</a>'});
  return h+(textOnly?lg+'</div>':'<div class="pie">'+svg+'</svg>'+lg+'</div></div>')+'</div>'}
function anaDetail(D){if(!sel)return "";var p=sel.indexOf("|"),t=sel.slice(0,p),k=sel.slice(p+1),L=D.items.filter(function(i){return i.t===t&&i.g===k});if(!L.length){sel=null;return ""}
  var tot=0,ag={},tx=[],byA=S.vp&&S.vp.b==="a";L.forEach(function(i){tot+=i.a;if(i.s==="tx")tx.push(i);else{var o=ag[i.n]=ag[i.n]||{a:0,c:0,s:i.s};o.a+=i.a;o.c++}});
  var h='<div class="dt"><div class="row"><b>'+(t==="in"?"收入":"支出")+'・'+esc(k)+'　'+nt(tot)+'</b><button class="x" data-g="">關閉</button></div>';
  Object.keys(ag).forEach(function(n){var o=ag[n],bits=[];if(o.s!=="sal")bits.push("每月固定");if(o.c>1)bits.push(o.c+" 個月");h+='<div class="row"><span>'+esc(n)+(bits.length?'<small class="mute">（'+bits.join("，")+'）</small>':'')+'</span><span>'+nt(o.a)+'</span></div>'});
  tx.sort(function(a,b){return a.d<b.d?1:-1}).forEach(function(i){h+='<div class="row"><span>'+i.d.slice(5).replace("-","/")+'・'+esc(i.n)+(byA&&i.c&&i.c!==i.n?'・'+esc(i.c):'')+'</span><span>'+txAmt(i.x)+'</span></div>'});
  return h+'</div>'}
function anaBox(m){var V=S.vp=S.vp||{},r=V.r||"m",b=V.b||"c",tm=V.t||"c",yr=r==="y",D=anaData(),T=D.T,saved=T.sal+T.oth-T.fx-T.sp,pr=T.goal>0?Math.min(100,Math.max(0,saved/T.goal*100)):0;
  function seg(k,v,lab,cur){return '<button data-vp="'+k+':'+v+'"'+(cur===v?' class="p"':'')+'>'+lab+'</button>'}
  var h='<div class="box"><h2>收支分析</h2><div class="seg">'+seg("r","m","月",r)+seg("r","y","年",r)+'</div><div class="seg">'+seg("b","c","依類別",b)+seg("b","a","依帳戶",b)+'</div><div class="seg">'+seg("t","c","圖表＋文字",tm)+seg("t","t","純文字",tm)+'</div>';

  h+='</div><div class="g3"><input id="fn" placeholder="項目，例如房租" aria-label="新項目"><input id="fa" type="number" inputmode="decimal" placeholder="金額" aria-label="新金額"><button id="fadd">新增</button></div><div class="mute">固定支出合計 '+nt(fixedSum())+'。每筆下方可選扣款帳戶，右邊數字是每月幾號扣款（外幣帳戶會依匯率換算）。兩個月繳一次等週期費用，計算時已平均到每月。想累計某筆總共付了多少，可先在存款帳戶新增一個累計用帳戶（取消勾選「目前有存款」），再在「轉入累計帳戶」選它。</div></div>';
  h+='<div class="box"><h2>調薪紀錄</h2>';
  (S.raises||[]).slice().sort(function(a,b){return a.from<b.from?-1:1}).forEach(function(r){h+='<div class="g3"><span>'+r.from.replace("-","年")+'月起</span><span>'+nt(r.amt)+'</span><button class="x" data-rdel="'+r.id+'">刪除</button></div>'});
  h+='<div class="grid" style="margin-top:6px"><div><label for="rf">生效月份</label><input id="rf" type="month"></div><div><label for="ra">調整後月薪</label><input id="ra" type="number" inputmode="decimal" min="0" placeholder="0"></div></div><p style="margin:10px 0 0"><button id="radd">新增調薪</button></p><p class="mute" style="margin:8px 0 0">調薪只影響生效月份之後，過去月份的計算不會變。上方填的月薪，是第一筆調薪之前使用的金額。</p></div>';
  h+='<div class="box"><h2>存款帳戶（銀行與現金）</h2>';
  (S.accts||[]).forEach(function(a){h+='<div class="acc" data-aid="'+a.id+'"><label class="on"><input type="checkbox" data-k="on" '+(a.on?"checked":"")+' style="width:auto">目前有存款<select data-k="cur" style="width:auto;margin-left:auto" aria-label="幣別">'+curOpts(a.cur)+'</select></label><input data-k="name" value="'+esc(a.name)+'" aria-label="帳戶名稱"><input data-k="bal" type="number" inputmode="decimal" value="'+a.bal+'" aria-label="餘額"><button class="x" data-adel="'+a.id+'">刪除</button></div>'});
  h+='<div class="acc"><select id="ac" style="grid-column:1/-1" aria-label="幣別">'+curOpts("TWD")+'</select><input id="an" placeholder="帳戶名稱，例如郵局" aria-label="新帳戶名稱"><input id="ab" type="number" inputmode="decimal" placeholder="餘額" aria-label="新帳戶餘額"><button id="aadd">新增</button></div><div class="mute">快速新增：</div><div class="chips">'+["現金錢包","郵局","台灣銀行","中國信託","玉山銀行","國泰世華","台新銀行"].map(function(n){return '<button data-chip="'+n+'">'+n+'</button>'}).join("")+'</div><div class="mute" style="margin-top:10px">有存款的帳戶合計 '+nt(acctTotal())+'。取消勾選「目前有存款」的帳戶，不會計入總覽。</div></div>';
  h+='<div class="box"><h2>匯率（換算成台幣）</h2><div class="grid">'+["USD","JPY","EUR","CNY","HKD"].map(function(c){return '<div><label for="r'+c+'">1 '+c+' ＝ 台幣</label><input id="r'+c+'" data-rate="'+c+'" type="number" step="any" inputmode="decimal" value="'+rate(c)+'"></div>'}).join("")+'</div><p class="mute" style="margin:8px 0 0">預設值只是概略估計，請依實際匯率自行更新。外幣帳戶會用這裡的匯率折合台幣。</p></div>';
  h+='<div class="box"><h2>每月預算上限</h2><div class="grid"><div><label for="sc">上限金額（留空＝自動）</label><input id="sc" type="number" inputmode="decimal" min="0" value="'+(S.cap||"")+'" placeholder="'+Math.round(autoCap())+'"></div><div><label for="sw">提早警告（%）</label><input id="sw" type="number" min="1" max="100" value="'+S.warn+'"></div></div><p class="mute" style="margin:8px 0 0">自動上限等於月薪減固定支出再減儲蓄目標。花到警告比例與超過上限時，都會跳出提醒。</p></div>';
  h+='<div class="box"><h2>提醒</h2><div class="grid"><div><label for="sp">每月發薪日／提醒日（1 至 31）</label><input id="sp" type="number" min="1" max="31" value="'+S.payday+'"></div><div><label for="st">每日記帳提醒時間</label><input id="st" type="time" value="'+S.dtime+'"></div></div><p style="margin:12px 0 6px"><label style="display:flex;gap:8px;align-items:center;color:var(--ink)"><input id="sd" type="checkbox" style="width:auto" '+(S.daily?"checked":"")+'>每天提醒我記帳</label></p><button id="sn">開啟瀏覽器通知</button><p class="mute" style="margin:8px 0 0">提醒會在頁面開著時出現。網頁無法在關閉後主動推播，建議把本頁加入手機主畫面或釘選分頁。</p></div>';
  h+='<div class="box"><h2>外觀</h2><button data-theme-set="light"'+(S.theme!=="dark"?' class="p"':'')+'>淺色竹林</button> <button data-theme-set="dark"'+(S.theme==="dark"?' class="p"':'')+'>深色夜林</button></div>';
  h+='<div class="box"><h2>資料備份</h2><p class="mute" style="margin:0 0 10px">資料只存在這個瀏覽器裡，換裝置或清除資料前請先匯出。</p><button id="ex">匯出 JSON</button> <button id="im">匯入 JSON</button> <button class="x" id="rs">清除全部</button><input id="imf" type="file" accept="application/json" class="hide"></div>';
  $("set").innerHTML=h;
  $("ss").onchange=function(){S.salary=Math.max(0,+this.value||0);save();renderAll()};
  $("so").onchange=function(){S.salOv=S.salOv||{};if(this.value==="")delete S.salOv[view];else S.salOv[view]=Math.max(0,+this.value||0);save();renderAll()};
  $("pa").onchange=function(){S.payAcct=this.value;S.paid=S.paid||{};var n=new Date(),mm=ym(n);if(this.value&&n.getDate()>=Math.min(S.payday,dim(mm)))S.paid[mm]=1;save();renderAll()};
  $("sr").onchange=function(){S.rate=Math.min(100,Math.max(0,+this.value||0));save();renderAll()};
  $("aadd").onclick=function(){var n=$("an").value.trim(),b=parseFloat($("ab").value)||0;if(!n){toast("請輸入帳戶名稱");$("an").focus();return}S.accts.push({id:uid(),name:n,bal:b,cur:$("ac").value,on:true});save();toast("✓ 已新增帳戶");renderAll()};
  document.querySelectorAll("[data-aid] input,[data-aid] select").forEach(function(i){i.onchange=function(){var id=i.closest("[data-aid]").dataset.aid,a=S.accts.filter(function(x){return x.id===id})[0];if(!a)return;if(i.dataset.k==="on")a.on=i.checked;else if(i.dataset.k==="bal")a.bal=+i.value||0;else if(i.dataset.k==="cur")a.cur=i.value;else a.name=i.value;save();renderAll()}});
  $("radd").onclick=function(){var f=$("rf").value,a=parseFloat($("ra").value);if(!/^\d{4}-\d{2}$/.test(f)||!(a>=0)){alert("請選擇生效月份並輸入調整後月薪。");return}S.raises=(S.raises||[]).filter(function(r){return r.from!==f});S.raises.push({id:uid(),from:f,amt:a});save();toast("✓ 已新增調薪");renderAll()};
  document.querySelectorAll("[data-rdel]").forEach(function(b){b.onclick=function(){S.raises=S.raises.filter(function(r){return r.id!==b.dataset.rdel});save();toast("✓ 已刪除調薪紀錄");renderAll()}});
  document.querySelectorAll("[data-rate]").forEach(function(i){i.onchange=function(){S.rates=S.rates||{};S.rates[i.dataset.rate]=+i.value>0?+i.value:DR[i.dataset.rate];save();renderAll()}});
  document.querySelectorAll("[data-adel]").forEach(function(b){b.onclick=function(){S.accts=S.accts.filter(function(x){return x.id!==b.dataset.adel});save();toast("✓ 已刪除帳戶");renderAll()}});
  document.querySelectorAll("[data-chip]").forEach(function(b){b.onclick=function(){if(S.accts.some(function(x){return x.name===b.dataset.chip}))return;S.accts.push({id:uid(),name:b.dataset.chip,bal:0,on:true});save();toast("✓ 已新增帳戶");renderAll()}});
  $("sc").onchange=function(){S.cap=Math.max(0,+this.value||0);save();renderAll()};
  $("sw").onchange=function(){S.warn=Math.min(100,Math.max(1,+this.value||80));save();renderAll()};
  $("sp").onchange=function(){S.payday=Math.min(31,Math.max(1,+this.value||1));save();checkAlerts()};
  $("st").onchange=function(){S.dtime=this.value||"21:00";save();checkAlerts()};
  $("sd").onchange=function(){S.daily=this.checked;save();checkAlerts()};
  $("fadd").onclick=function(){var n=$("fn").value.trim(),a=parseFloat($("fa").value);if(!n||!(a>=0)){toast("請輸入項目名稱和金額");$("fn").focus();return}S.fixed.push({id:uid(),name:n,amt:a});save();toast("✓ 已新增固定支出");renderAll()};
  document.querySelectorAll("[data-fid] input,[data-fid] select").forEach(function(i){i.onchange=function(){var f=S.fixed.filter(function(x){return x.id===i.parentNode.dataset.fid})[0];if(!f)return;if(i.dataset.k==="amt")f.amt=+i.value||0;else if(i.dataset.k==="acct"){f.acct=i.value;fMark(f)}else if(i.dataset.k==="day"){f.day=Math.min(31,Math.max(1,+i.value||1));fMark(f)}else if(i.dataset.k==="to"){f.to=i.value;fMark(f)}else if(i.dataset.k==="every"){f.every=+i.value||1;if(f.every>1&&!f.start)f.start=ym(new Date());fMark(f)}else if(i.dataset.k==="start"){if(/^\d{4}-\d{2}$/.test(i.value)){f.start=i.value;fMark(f)}}else f.name=i.value;save();renderAll()}});
  document.querySelectorAll("[data-fpay]").forEach(function(b){b.onclick=function(){var f=S.fixed.filter(function(x){return x.id===b.dataset.fpay})[0];if(f)toast(payFixed(f))}});
  document.querySelectorAll("[data-fnext]").forEach(function(b){b.onclick=function(){var f=S.fixed.filter(function(x){return x.id===b.dataset.fnext})[0];if(f)toast(payFixed(f,1))}});
  document.querySelectorAll("[data-fdel]").forEach(function(b){b.onclick=function(){S.fixed=S.fixed.filter(function(x){return x.id!==b.dataset.fdel});save();toast("✓ 已刪除固定支出");renderAll()}});
  $("sn").onclick=function(){if(!("Notification" in window)){alert("這個瀏覽器不支援通知，會改用頁面內的提醒橫幅。");return}Notification.requestPermission().then(function(p){alert(p==="granted"?"已開啟通知。":"尚未允許通知，會改用頁面內的提醒橫幅。")})};
  document.querySelectorAll("[data-theme-set]").forEach(function(b){b.onclick=function(){S.theme=b.dataset.themeSet;save();toast("✓ 已切換外觀");renderAll()}});
  $("ex").onclick=function(){var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:"application/json"}));a.download="budget-"+ymd(new Date())+".json";a.click()};
  $("im").onclick=function(){$("imf").click()};
  $("imf").onchange=function(){var f=this.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var o=JSON.parse(r.result);if(!o||typeof o!=="object"||!Array.isArray(o.tx))throw 0;for(var k in o)S[k]=o[k];save();renderAll();alert("匯入完成。")}catch(e){alert("檔案格式不正確。")}};r.readAsText(f)};
  $("rs").onclick=function(){if(confirm("確定要清除所有資料嗎？此動作無法復原。")){try{localStorage.removeItem(KEY)}catch(e){}S={theme:"light",xfer:[],rates:{},accts:[],cap:0,warn:80,salary:0,payday:5,daily:true,dtime:"21:00",rate:20,fixed:[],tx:[],start:ym(new Date()),notified:"",dis:{}};renderAll()}};
}

function checkAlerts(){
  var now=new Date(),td=ymd(now),box=$("alerts"),h="",items=[];
  var pd=Math.min(S.payday,dim(ym(now)));
  if(now.getDate()===pd&&!S.dis["m"+td])items.push({k:"m"+td,t:"今天是每月 "+S.payday+" 號：確認薪水與固定支出，並檢視上個月存了多少。"});
  var c=cap(),mm=ym(now),sp=spent(mm);
  if(c>0){var r=sp/c;
    if(r>=1&&!S.dis["o"+mm])items.push({k:"o"+mm,t:"本月開銷已超過預算上限 "+nt(sp-c)+"（上限 "+nt(c)+"），剩下的日子建議先暫停非必要消費。"});
    else if(r>=S.warn/100&&r<1&&!S.dis["w"+mm])items.push({k:"w"+mm,t:"本月開銷已達預算上限的 "+Math.round(r*100)+"%，還剩 "+nt(c-sp)+"。"});}
  var hm=pad(now.getHours())+":"+pad(now.getMinutes());
  var logged=S.tx.some(function(t){return t.date===td});
  if(S.daily&&hm>=S.dtime&&!logged&&!S.dis["d"+td])items.push({k:"d"+td,t:"今天還沒有記帳，花一分鐘記下今天的開銷吧。"});
  items.forEach(function(i){h+='<div class="alert" role="alert"><span>'+esc(i.t)+'</span><button data-dis="'+i.k+'">知道了</button></div>'});
  box.innerHTML=h;
  box.querySelectorAll("[data-dis]").forEach(function(b){b.onclick=function(){S.dis[b.dataset.dis]=1;save();checkAlerts()}});
  if(items.length&&S.notified!==td+items.length&&"Notification"in window&&Notification.permission==="granted"){S.notified=td+items.length;save();try{new Notification("月薪分配記帳本",{body:items[0].t})}catch(e){}}
}

function bind(){
  document.querySelectorAll("[data-go]").forEach(function(b){b.onclick=function(){setTab(b.dataset.go)}});
  document.querySelectorAll("[data-vp]").forEach(function(b){b.onclick=function(){var p=b.dataset.vp.split(":");S.vp=S.vp||{};S.vp[p[0]]=p[1];sel=null;save();renderAll()}});
  document.querySelectorAll("[data-yr]").forEach(function(b){b.onclick=function(){view=shift(view,12*(+b.dataset.yr));sel=null;renderAll()}});
  document.querySelectorAll("[data-g]").forEach(function(b){var go=function(){var v=b.dataset.g;sel=(!v||sel===v)?null:v;renderAll()};b.onclick=go;b.onkeydown=function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();go()}}});
  document.querySelectorAll("[data-pietog]").forEach(function(b){b.onclick=function(){S.pieSal=S.pieSal===false;save();toast(S.pieSal===false?"✓ 收入圖不含月薪":"✓ 收入圖含月薪");renderAll()}});
  document.querySelectorAll("[data-edit]").forEach(function(b){b.onclick=function(){editTx=b.dataset.edit;editX=null;renderAll();toast("請在上方修改後按「儲存修改」")}});
  document.querySelectorAll("[data-del]").forEach(function(b){b.onclick=function(){var t0=S.tx.filter(function(t){return t.id===b.dataset.del})[0];if(t0&&t0.acct)adjT(t0);S.tx=S.tx.filter(function(t){return t.id!==b.dataset.del});save();toast("✓ 已刪除這筆紀錄");renderAll()}});
}
function setTab(t){
  tab=t;["home","log","set"].forEach(function(s){$(s).classList.toggle("hide",s!==t)});
  document.querySelectorAll("nav button").forEach(function(b){b.setAttribute("aria-selected",b.dataset.t===t)});
}
function renderAll(){
  autoPay();autoFixed();applyTheme();
  $("ml").textContent=view.replace("-","年")+"月";
  renderHome();renderLog();renderSet();checkAlerts();foldify();
}
document.querySelectorAll("nav button").forEach(function(b){b.onclick=function(){setTab(b.dataset.t)}});
$("pm").onclick=function(){view=shift(view,-1);renderAll()};
$("nm").onclick=function(){view=shift(view,1);renderAll()};
$("set").addEventListener("change",function(e){if(e.target.type==="file")return;toast("✓ 已儲存")});
renderAll();
setInterval(function(){if(autoPay()|autoFixed())renderAll();else checkAlerts()},60000);
document.addEventListener("visibilitychange",function(){if(!document.hidden){if(autoPay()|autoFixed())renderAll();else checkAlerts()}});
})();
</script>
